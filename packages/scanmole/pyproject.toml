# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/

[project]
name = "scanmole"
version = "1.1.0"
description = "Scan documents from a SANE scanner straight to a searchable PDF."
keywords = ["scanning", "scanner", "document-processing", "linux", "sane", "pdf", "ocr"]
license = "GPL-3.0-or-later"
license-files = ["LICENSES/*.txt"]
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
  { name = "foundata GmbH" },
  { name = "Andreas Haerter", email = "ah@foundata.com" },
]
maintainers = [
  { name = "Andreas Haerter", email = "ah@foundata.com" },
]
requires-python = ">=3.12"
dependencies = [
  # Raster rotation for host-side deskew (scanmole/deskew.py). The only
  # runtime dependency: rotating a page well needs resampling, which the
  # standard library has no image support for, and every alternative
  # (ImageMagick, unpaper, OpenCV, a Leptonica binding) is either a second
  # external tool or a far larger surface for one operation.
  "pillow>=10.0",
]

# https://pypi.org/classifiers/
classifiers = [
  "Development Status :: 5 - Production/Stable",

  # Indication for whom the project is for
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
  "Topic :: Office/Business",
  "Topic :: Utilities",

  # Supported Python versions
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
scanmole = "scanmole.cli:main"

[project.urls]
Homepage = "https://foundata.com/en/projects/scanmole/"
Documentation = "https://foundata.com/en/projects/scanmole/#doc"
Repository = "https://foundata.com/en/projects/scanmole/#source"
Issues = "https://foundata.com/en/projects/scanmole/#issues"
Changelog = "https://foundata.com/en/projects/scanmole/#changelog"

[tool.uv.build-backend]
# Developer-tree litter must never ship: uv_build excludes __pycache__ by
# itself but not other tool caches sitting inside src/ (a .mypy_cache once
# reached the published 1.0.0 GUI wheel).
source-exclude = ["**/.mypy_cache", "**/.ruff_cache", "**/.pytest_cache"]
wheel-exclude = ["**/.mypy_cache", "**/.ruff_cache", "**/.pytest_cache"]

[build-system]
requires = ["uv_build>=0.11.32,<0.13"]
build-backend = "uv_build"

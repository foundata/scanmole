# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/

[project]
name = "scanmole-gui"
version = "1.0.0"
description = "GTK4/libadwaita frontend for ScanMole, the SANE-scanner-to-searchable-PDF tool."
keywords = ["scanning", "scanner", "sane", "adf", "pdf", "ocr", "paperless", "gtk"]
license = "GPL-3.0-or-later"
license-files = ["LICENSES/*.txt"]
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
  { name = "foundata GmbH" },
  { name = "Andreas Haerter", email = "ah@foundata.com" },
]
maintainers = [
  { name = "Andreas Haerter", email = "ah@foundata.com" },
]
requires-python = ">=3.12"
# The pin mirrors the runtime version handshake: GUI and CLI are compatible
# while their SemVer majors match.
dependencies = ["scanmole>=1.0.0,<2"]

# PyGObject/GTK4/libadwaita deliberately come from distribution packages (a
# venv with --system-site-packages), not from PyPI: the PyPI PyGObject is a
# source build needing C headers and cannot deliver GTK itself.

# https://pypi.org/classifiers/
classifiers = [
  "Development Status :: 5 - Production/Stable",

  # Indication for whom the project is for
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
  "Topic :: Office/Business",
  "Topic :: Utilities",

  # Supported Python versions
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
scanmole-gui = "scanmole_gui:main"

[project.urls]
Homepage = "https://foundata.com/en/projects/scanmole/"
Documentation = "https://foundata.com/en/projects/scanmole/#doc"
Repository = "https://foundata.com/en/projects/scanmole/#source"
Issues = "https://foundata.com/en/projects/scanmole/#issues"
Changelog = "https://foundata.com/en/projects/scanmole/#changelog"

[tool.uv.sources]
scanmole = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

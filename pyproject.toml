# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/

[project]
name = "scanmole"
version = "0.1.0"
description = "Scan documents from a SANE scanner straight to a searchable PDF."
keywords = ["scanning", "scanner", "sane", "adf", "pdf", "ocr", "paperless", "gtk"]
license = "GPL-3.0-or-later"
license-files = ["LICENSES/*.txt"]
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
  { name = "foundata GmbH" },
  { name = "Andreas Haerter", email = "ah@foundata.com" },
]
maintainers = [
  { name = "Andreas Haerter", email = "ah@foundata.com" },
]
requires-python = ">=3.12"
dependencies = []

# https://pypi.org/classifiers/
classifiers = [
  "Development Status :: 4 - Beta",

  # Indication for whom the project is for
  "Environment :: Console",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
  "Topic :: Office/Business",
  "Topic :: Utilities",

  # Supported Python versions
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
# The GUI needs PyGObject. On Fedora this is normally the system package
# python3-gobject; installing it into a venv additionally requires the
# gobject-introspection and cairo development headers.
gui = ["pygobject>=3.50"]

[project.scripts]
scanmole = "scanmole.cli:main"
scanmole-gui = "scanmole.gui:main"

[project.urls]
Homepage = "https://foundata.com/en/projects/scanmole/"
Documentation = "https://foundata.com/en/projects/scanmole/#doc"
Repository = "https://foundata.com/en/projects/scanmole/#source"
Issues = "https://foundata.com/en/projects/scanmole/#issues"
Changelog = "https://foundata.com/en/projects/scanmole/#changelog"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=9.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.12.7",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# https://docs.astral.sh/ruff/settings/#lint_select
select = [
  "E4",  # pycodestyle import errors
  "E7",  # pycodestyle statement errors
  "E9",  # pycodestyle runtime errors
  "F",   # Pyflakes
  "I",   # import sorting
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "RUF", # Ruff-specific rules
]

[tool.mypy]
python_version = "3.12"
strict = true
enable_error_code = ["explicit-override"] # Extends strict mode.
warn_unreachable = true                   # Extends strict mode.

# PyGObject ships no type stubs; the gi bindings resolve to Any. The GUI code
# itself is checked strictly, with per-line ignores only where the GTK
# boundary cannot be expressed (e.g. subclassing the Any-typed widget classes).
[[tool.mypy.overrides]]
module = ["gi", "gi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
]
filterwarnings = ["error"]
strict = true
testpaths = ["tests"]
markers = [
  "integration: exercises external tools (img2pdf/ocrmypdf); skipped if absent",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 88

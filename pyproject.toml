# Virtual workspace root: the installable packages live under packages/
# (scanmole: the CLI engine; scanmole-gui: the GTK4 frontend on top of it).
# Shared tooling configuration and the dev dependencies live here.

[tool.uv.workspace]
members = ["packages/*"]

[tool.releasing]
repository = "foundata/scanmole"
version-files = [
  "packages/scanmole/pyproject.toml",
  "packages/scanmole-gui/pyproject.toml",
]
# Lockstep: every release raises this lower bound to its own new version. A new
# major still needs the upper bound raised by hand.
dependency-pins = [
  { file = "packages/scanmole-gui/pyproject.toml", name = "scanmole" },
]

# Contributions are disclosed with an Assisted-by: trailer. The pattern allows
# that disclosure without an address only: an address in the line is what a
# forge turns into a contributor entry.
allowed-attribution = ["assisted-by: ^[^<]*$"]

# The members ship pointer READMEs; the prepared project README is copied over
# both inside the export, so each PyPI page shows the full project page.
[[tool.releasing.readmes]]
copies = [
  "packages/scanmole/README.md",
  "packages/scanmole-gui/README.md",
]

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=9.0",
  "pytest-cov>=5.0.0",
  "releasing>=4,<5",
  "ruff>=0.12.7",
  "rumdl>=0.2.72",
]

[tool.ruff]
line-length = 88
target-version = "py312"
# First-party detection across the workspace members.
src = ["packages/scanmole/src", "packages/scanmole-gui/src"]

[tool.ruff.lint]
# https://docs.astral.sh/ruff/settings/#lint_select
select = [
  "E4",  # pycodestyle import errors
  "E7",  # pycodestyle statement errors
  "E9",  # pycodestyle runtime errors
  "F",   # Pyflakes
  "I",   # import sorting
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "RUF", # Ruff-specific rules
]

[tool.mypy]
python_version = "3.12"
strict = true
enable_error_code = ["explicit-override"] # Extends strict mode.
warn_unreachable = true                   # Extends strict mode.

# PyGObject ships no type stubs; the gi bindings resolve to Any. The GUI code
# itself is checked strictly, with per-line ignores only where the GTK
# boundary cannot be expressed (e.g. subclassing the Any-typed widget classes).
[[tool.mypy.overrides]]
module = ["gi", "gi.*"]
ignore_missing_imports = true

# ocrmypdf is an external tool, not a dependency: the plugin ScanMole ships
# for it is loaded by ocrmypdf's own interpreter and imports its API there.
# Checking must not require it to be installed alongside the engine.
[[tool.mypy.overrides]]
module = ["ocrmypdf", "ocrmypdf.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
]
filterwarnings = ["error"]
pythonpath = ["tests"]  # shared helpers in tests/support/
strict = true
testpaths = ["tests"]
markers = [
  "integration: exercises external tools (img2pdf/ocrmypdf); skipped if absent",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 88
